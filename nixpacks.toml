[phases.setup]
# Removed 'npm' (it's part of nodejs) and 'yarn' (unnecessary for npx)
nixPkgs = ["binaryen", "rustup", "gcc", "pkg-config", "openssl", "fontconfig", "curl", "nodejs"]

[phases.build]
cmds = [
    "rustup default stable",
    "rustup target add wasm32-unknown-unknown",
    
    # 1. Download Tools
    "curl -L https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.106/wasm-bindgen-0.2.106-x86_64-unknown-linux-musl.tar.gz | tar xz",
    
    # 2. Build WASM
    "cargo build --release --target wasm32-unknown-unknown",
    
    # 3. Prepare Directory Structure (Use 'public' to act as our web root)
    "mkdir -p public",
    
    # 4. Generate JS Bindings into 'public'
    "./wasm-bindgen-0.2.106-x86_64-unknown-linux-musl/wasm-bindgen --out-dir ./public --target web --no-typescript ./target/wasm32-unknown-unknown/release/farm-blazer.wasm",
    
    # 5. Optimize WASM
    "wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -o ./public/farm-blazer_bg.wasm ./public/farm-blazer_bg.wasm",
    
    # 6. Copy Game Assets (Models/Textures) into 'public'
    # We copy the *content* of local assets folder into public/assets
    "mkdir -p public/assets",
    "cp -r assets/* public/assets/",
    
    # 7. OPTIONAL: Pre-install http-server globally to speed up boot time
    "npm install -g http-server",

    # 8. DUMMY BINARY TRICK (Required so Nixpacks doesn't fail looking for a rust binary)
    "mkdir -p bin",
    "touch bin/farm-blazer",
    "chmod +x bin/farm-blazer"
]

[start]
# Use the global http-server we installed in step 7
cmd = "http-server ./public -p 80"
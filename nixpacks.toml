[phases.setup]
nixPkgs = ["caddy", "binaryen", "rustup", "gcc", "pkg-config", "openssl", "fontconfig"]

[phases.build]
cmds = [
    "rustup default stable",
    "rustup target add wasm32-unknown-unknown",
    # Download wasm-bindgen CLI
    "curl -L https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.106/wasm-bindgen-0.2.106-x86_64-unknown-linux-musl.tar.gz | tar xz",
    # Build the WASM (Rust produces underscores!)
    "cargo build --release --target wasm32-unknown-unknown",
    # Generate bindings (Input is farm_blazer.wasm, Output is farm-blazer)
    "./wasm-bindgen-0.2.106-x86_64-unknown-linux-musl/wasm-bindgen --out-dir ./out --target web --no-typescript ./target/wasm32-unknown-unknown/release/farm_blazer.wasm",
    # Optimize the WASM file
    "wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -o ./out/farm_blazer_bg.wasm ./out/farm_blazer_bg.wasm",
    # FIX: Create a dummy binary to satisfy Nixpacks' default Rust provider
    "mkdir -p bin",
    "touch bin/farm-blazer",
    "chmod +x bin/farm-blazer"
]

[start]
cmd = "caddy file-server --root ./out --listen :80"
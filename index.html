<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm Defense | Command Terminal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon: #00f3ff;
            --neon-dim: rgba(0, 243, 255, 0.3);
            --danger: #ff3333;
            --success: #64ffda;
            --bg: #03080a;
            --panel: rgba(0, 20, 30, 0.85);
        }

        /* --- CORE --- */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg);
            font-family: 'Rajdhani', sans-serif; color: white; user-select: none;
        }

        /* --- TACTICAL VISUALS --- */
        .bg-grid {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: 
                linear-gradient(var(--neon-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-dim) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(1000px) rotateX(60deg);
            animation: grid-move 30s linear infinite;
            z-index: 0; opacity: 0.2;
        }
        @keyframes grid-move {
            0% { transform: perspective(1000px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(1000px) rotateX(60deg) translateY(50px); }
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 50%);
            background-size: 100% 4px; z-index: 1000; pointer-events: none; opacity: 0.4;
        }

        canvas {
            display: block; width: 100% !important; height: 100% !important;
            position: absolute; top: 0; left: 0; z-index: 1; opacity: 0;
            transition: opacity 2s ease-in;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a1428 0%, #000 100%);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900; letter-spacing: 12px;
            text-shadow: 0.05em 0 0 rgba(255,0,0,.75), -0.05em -0.025em 0 rgba(0,255,0,.75), 0.025em 0.05em 0 rgba(0,0,255,.75);
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255,0,0,.75), -0.05em -0.025em 0 rgba(0,255,0,.75), -0.025em 0.05em 0 rgba(0,0,255,.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255,0,0,.75), -0.05em -0.025em 0 rgba(0,255,0,.75), -0.025em 0.05em 0 rgba(0,0,255,.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255,0,0,.75), 0.025em 0.025em 0 rgba(0,255,0,.75), -0.05em -0.05em 0 rgba(0,0,255,.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255,0,0,.75), 0.025em 0.025em 0 rgba(0,255,0,.75), -0.05em -0.05em 0 rgba(0,0,255,.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255,0,0,.75), 0.05em 0 0 rgba(0,255,0,.75), 0 -0.05em 0 rgba(0,0,255,.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255,0,0,.75), 0.05em 0 0 rgba(0,255,0,.75), 0 -0.05em 0 rgba(0,0,255,.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255,0,0,.75), -0.025em -0.025em 0 rgba(0,255,0,.75), -0.025em -0.05em 0 rgba(0,0,255,.75); }
        }

        .loading-container { width: 400px; max-width: 85vw; margin-top: 50px; }
        .progress-frame { border: 1px solid var(--neon); padding: 4px; background: rgba(0, 243, 255, 0.05); }
        .progress-bar { height: 10px; width: 0%; background: var(--neon); box-shadow: 0 0 15px var(--neon); transition: width 0.2s ease-out; }
        
        .status-text {
            font-family: 'Share Tech Mono', monospace; font-size: 0.8rem;
            margin-top: 10px; color: var(--neon); text-transform: uppercase;
            display: flex; justify-content: space-between;
        }

        /* --- BUTTONS --- */
        .cmd-btn {
            display: none; margin-top: 40px; padding: 15px 50px;
            font-family: 'Orbitron', sans-serif; font-weight: 700;
            background: transparent; color: var(--neon); border: 2px solid var(--neon);
            cursor: pointer; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .cmd-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 30px var(--neon); }

        /* --- TRIAL HUD --- */
        #hud-timer {
            position: fixed; top: 20px; right: 20px; z-index: 500;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0,0,0,0.7); padding: 10px 20px;
            border-left: 4px solid var(--neon); display: none;
            backdrop-filter: blur(5px);
        }

        /* --- PAYMENT MODAL --- */
        #payment-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; background: rgba(1, 8, 10, 0.98);
            flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(15px);
        }

        .pay-card {
            background: var(--panel); border: 1px solid var(--neon);
            padding: 40px; width: 500px; max-width: 90vw;
            text-align: center; clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
        }

        .pay-option {
            width: 100%; margin: 12px 0; padding: 18px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            background: rgba(255,255,255,0.03); color: white;
            font-family: 'Orbitron'; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .pay-option:hover { border-color: var(--neon); background: rgba(0, 243, 255, 0.15); box-shadow: 0 0 20px rgba(0,243,255,0.2); }
        .pay-option.sol { border-color: #9945FF; }
        .pay-option.eth { border-color: #627EEA; }

        #pay-status { margin-top: 20px; color: var(--neon); font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanlines"></div>

    <div id="hud-timer">
        LINK_STABILITY: <span id="timer-val" style="color: var(--success);">30.00</span>s
    </div>

    <!-- LOADER -->
    <div id="loader">
        <div class="glitch-title">SWARM DEFENSE</div>
        <div style="color: var(--neon); letter-spacing: 5px; font-weight: 600; margin-top: 5px;">COMMAND TERMINAL v2.0</div>

        <div id="load-wrapper" class="loading-container">
            <div class="progress-frame">
                <div id="bar" class="progress-bar"></div>
            </div>
            <div class="status-text">
                <span id="status">Establishing Neural Uplink...</span>
                <span id="percent">0%</span>
            </div>
        </div>

        <button id="start-btn" class="cmd-btn">ENGAGE SYSTEM</button>
    </div>

    <!-- PAYWALL -->
    <div id="payment-modal">
        <div class="pay-card">
            <h1 class="glitch-title" style="font-size: 2rem; color: var(--danger);">LINK DISCONNECTED</h1>
            <p style="color: #888; letter-spacing: 1px; margin-bottom: 30px;">Maintain High Command connection to continue operations.</p>
            
            <button id="pay-card-btn" class="pay-option">
                <span>CREDIT CARD / STRIPE</span>
                <small>$9.99</small>
            </button>
            <button id="pay-sol-btn" class="pay-option sol">
                <span>SOLANA</span>
                <small>0.1 SOL</small>
            </button>
            <button id="pay-eth-btn" class="pay-option eth">
                <span>ETHEREUM</span>
                <small>0.01 ETH</small>
            </button>

            <div id="pay-status"></div>
        </div>
    </div>

    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <script type="module">
        import init from './farm-blazer.js';
        const WASM_PATH = './farm-blazer.wasm';

        const bar = document.getElementById('bar');
        const percentTxt = document.getElementById('percent');
        const statusTxt = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const loader = document.getElementById('loader');
        const hud = document.getElementById('hud-timer');
        const payModal = document.getElementById('payment-modal');

        let wasmBlobUrl = null;

        async function download() {
            try {
                const response = await fetch(WASM_PATH);
                if (!response.ok) throw new Error("Connection Lost");

                const total = parseInt(response.headers.get('Content-Length'), 10);
                let loaded = 0;
                const reader = response.body.getReader();
                const chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    
                    if (total) {
                        const p = Math.round((loaded / total) * 100);
                        bar.style.width = p + '%';
                        percentTxt.innerText = p + '%';
                        statusTxt.innerText = `Buffering Data Vectors...`;
                    }
                }

                wasmBlobUrl = URL.createObjectURL(new Blob(chunks, { type: 'application/wasm' }));
                statusTxt.innerText = "System Ready";
                document.getElementById('load-wrapper').style.opacity = '0.3';
                startBtn.style.display = 'block';

            } catch (e) {
                statusTxt.innerText = "CRITICAL FAILURE: Uplink Interrupted";
                statusTxt.style.color = "red";
            }
        }

        async function boot() {
            startBtn.innerText = "INITIALIZING...";
            startBtn.disabled = true;

            try {
                // Bevy Init
                try {
                    await init(wasmBlobUrl);
                } catch (e) {
                    if (!e.message || e.message.indexOf('exceptions for control flow') === -1) throw e;
                }

                URL.revokeObjectURL(wasmBlobUrl);
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.remove();
                    hud.style.display = 'block';
                    startTrial();
                    const canvas = document.querySelector('canvas');
                    if(canvas) { canvas.style.opacity = '1'; canvas.focus(); }
                }, 1000);

            } catch (e) {
                console.error(e);
                startBtn.innerText = "BOOT ERROR";
            }
        }

        function startTrial() {
            let timeLeft = 30.0;
            const timerVal = document.getElementById('timer-val');
            
            const interval = setInterval(() => {
                timeLeft -= 0.01;
                timerVal.innerText = timeLeft.toFixed(2);
                
                if (timeLeft <= 10) timerVal.style.color = "var(--danger)";

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerVal.innerText = "0.00";
                    payModal.style.display = 'flex';
                }
            }, 10);
        }

        // --- PAYMENT MOCK LOGIC ---
        const payStatus = document.getElementById('pay-status');

        document.getElementById('pay-card-btn').onclick = () => {
            payStatus.innerText = "Connecting to Secure Gateway...";
            // Add your Dodo/Stripe logic here
        };

        document.getElementById('pay-sol-btn').onclick = async () => {
            if (!window.solana) return window.open("https://phantom.app/", "_blank");
            payStatus.innerText = "Awaiting Wallet Approval...";
            // Add Solana transfer logic here
        };

        startBtn.onclick = boot;
        download();
    </script>
</body>
</html>
